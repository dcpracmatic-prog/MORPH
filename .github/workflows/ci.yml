name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs the repository's own test target: builds both C++ solvers and the
  # shared library, runs the C++ improve12 regression tests, the Python unittest
  # suite (DIMACS runner, complement script, validator, ctypes wrapper), and the
  # smoke test over datasets/*.gph. There is no pyproject.toml or lean/ directory
  # in this repository, so no pip-install or Lean build steps are run.
  make-test:
    name: make test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and test
        run: make test
